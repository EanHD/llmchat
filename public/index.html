<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LLM Chat Interface - A minimal ChatGPT clone connecting to Kai LLM server. Chat with AI models in a clean, privacy-focused interface.">
  <meta name="keywords" content="llm, chat, ai, chatgpt, kai, pwa, offline, privacy">
  <meta name="author" content="LLM Chat">
  <meta name="theme-color" content="#2563eb">
  
  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.eanhd.com https:; worker-src 'self'; font-src 'self' data:;">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="LLM Chat - Minimal AI Chat Interface">
  <meta property="og:description" content="Chat with AI models in a clean, privacy-focused interface. Supports streaming, markdown, and offline access.">
  <meta property="og:image" content="./icons/icon-512.svg">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary">
  <meta property="twitter:title" content="LLM Chat - Minimal AI Chat Interface">
  <meta property="twitter:description" content="Chat with AI models in a clean, privacy-focused interface.">
  
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./assets/styles.css">

  <title>LLM Chat</title>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="primary">New Chat</button>
        <button id="close-sidebar-btn" class="icon close-sidebar-btn" aria-label="Close sidebar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="conversation-list" class="conversation-list">
        <!-- Conversation items will be rendered here -->
      </div>
      <div class="sidebar-footer">
        <button id="memory-btn" class="icon" aria-label="Memory">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </button>
        <button id="settings-btn" class="icon" aria-label="Settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main id="main" class="main">
      <header id="chat-header" class="chat-header">
        <button id="sidebar-toggle" class="icon" aria-label="Toggle sidebar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
        <h1 id="chat-title">New Chat</h1>
      </header>

      <div id="chat-container" class="chat-container">
        <div id="messages" class="messages">
          <!-- Messages will be rendered here -->
        </div>
      </div>

      <div id="input-area" class="input-area">
        <form id="message-form" class="message-form">
          <button type="button" id="livekit-btn" class="voice-btn" aria-label="Voice Mode" style="margin-right: 8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
              <path d="M2 20h20" stroke-opacity="0.5" />
            </svg>
          </button>
          <button type="button" id="voice-btn" class="voice-btn" aria-label="Dictation">
            <svg id="mic-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <rect x="6" y="4" width="4" height="16"/>
              <rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>
          <textarea 
            id="message-input" 
            class="message-input" 
            placeholder="Send a message..." 
            rows="1"
            aria-label="Message input"
          ></textarea>
          <button type="submit" id="send-btn" class="send-btn" aria-label="Send message">
            <svg id="send-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
            <svg id="stop-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display: none;">
              <rect x="6" y="6" width="12" height="12" rx="1"/>
            </svg>
          </button>
        </form>
      </div>
    </main>

    <!-- Settings Panel (Hidden by default) -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="close-settings-btn" class="icon" aria-label="Close settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="settings-content">
        <!-- Settings form will be rendered here -->
      </div>
    </div>

    <!-- Memory Panel (Hidden by default) -->
    <div id="memory-panel" class="settings-panel hidden">
      <div class="settings-header">
        <h2>Memory</h2>
        <button id="close-memory-btn" class="icon" aria-label="Close memory">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="settings-content">
        <div class="memory-section">
          <h3>Custom Instructions</h3>
          <p class="memory-description">Add custom instructions that will be included in every conversation to personalize responses.</p>
          <textarea id="custom-memory-input" class="memory-textarea" placeholder="e.g., 'I prefer concise responses', 'Always explain like I'm 5', etc." rows="6"></textarea>
          <button id="save-memory-btn" class="primary">Save Memory</button>
        </div>
        <div class="memory-section">
          <h3>Auto-Generated Memories</h3>
          <p class="memory-description">The AI automatically learns from your conversations and builds context over time.</p>
          <div id="auto-memories-list" class="auto-memories-list">
            <!-- Auto memories will be rendered here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Load app as ES module -->
  <script type="module" src="./app.js?v=1763531776"></script>
</body>
</html>
