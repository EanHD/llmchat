<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Kai - Your private AI companion powered by local models.">
  <meta name="keywords" content="llm, chat, ai, kai, pwa, offline, privacy, local models">
  <meta name="author" content="Kai">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kai">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.eanhd.com https:; worker-src 'self'; font-src 'self' data:;">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kai - Private AI Companion">
  <meta property="og:description" content="Your private AI companion — powered by local models.">
  <meta property="og:image" content="./icons/icon-512.svg">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary">
  <meta property="twitter:title" content="Kai - Private AI Companion">
  <meta property="twitter:description" content="Your private AI companion — powered by local models.">
  
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./src/opencode/styles.css">

  <title>Kai</title>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">Kai</div>
        <button id="new-chat-btn" class="icon" aria-label="New Chat">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button id="close-sidebar-btn" class="icon close-sidebar-btn" aria-label="Close sidebar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="conversation-list" class="conversation-list">
        <!-- Conversation items will be rendered here -->
      </div>
      <div class="sidebar-footer">
        <button id="memory-btn" class="icon" aria-label="Memory">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </button>
        <button id="settings-btn" class="icon" aria-label="Settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main id="main" class="main">
      <header id="chat-header" class="chat-header">
        <div class="header-left">
          <button id="sidebar-toggle" class="icon-btn-ghost mobile-only" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 id="chat-title" class="app-title">Kai</h1>
          <button id="header-new-chat-btn" class="icon-btn-ghost" aria-label="New Chat">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div class="header-right">
          <button id="opencode-toggle" class="icon-btn-ghost" aria-label="OpenCode IDE">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
            </svg>
          </button>
        </div>
      </header>

      <div id="chat-container" class="chat-container">
        <div id="messages" class="messages">
          <!-- Messages will be rendered here -->
        </div>
      </div>

      <!-- Floating New Chat FAB (shows when scrolled) -->
      <button id="new-chat-fab" class="fab-new-chat hidden" aria-label="New Chat">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>

      <div id="input-area" class="input-container">
        <div class="input-wrapper">
          <button id="attach-btn" class="input-icon-btn" aria-label="Attach">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          
          <textarea id="message-input" placeholder="Ask anything..." rows="1"></textarea>
          
          <div class="input-actions">
            <button id="mic-btn" class="input-icon-btn" aria-label="Voice Mode">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button id="send-btn" class="input-icon-btn send-btn hidden" aria-label="Send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Rage Reactions Menu (shown on long-press on assistant messages) -->
    <div id="reaction-menu" class="reaction-menu hidden" role="dialog" aria-label="Reactions">
      <button class="reaction-emoji" data-reaction="👎" aria-label="Too long">👎</button>
      <button class="reaction-emoji" data-reaction="🤓" aria-label="Over-explaining">🤓</button>
      <button class="reaction-emoji" data-reaction="💀" aria-label="Tone wrong">💀</button>
    </div>

    <!-- Settings Panel Backdrop -->
    <div id="settings-backdrop" class="panel-backdrop hidden"></div>

    <!-- Settings Panel (Hidden by default) -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="panel-header">
        <h2>Settings</h2>
        <button id="close-settings-btn" class="panel-close-btn" aria-label="Close settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="panel-content">
        <!-- Settings form will be rendered here -->
      </div>
    </div>

    <!-- Memory Panel Backdrop -->
    <div id="memory-backdrop" class="panel-backdrop hidden"></div>

    <!-- Memory Panel (Hidden by default) -->
    <div id="memory-panel" class="settings-panel hidden">
      <div class="panel-header">
        <h2>Memory</h2>
        <button id="close-memory-btn" class="panel-close-btn" aria-label="Close memory">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="panel-content">
        <div class="memory-section">
          <h3>Custom Instructions</h3>
          <p class="memory-description">Add custom instructions that will be included in every conversation to personalize responses.</p>
          <textarea id="custom-memory-input" class="memory-textarea" placeholder="e.g., 'I prefer concise responses', 'Always explain like I'm 5', etc." rows="6"></textarea>
          <button id="save-memory-btn" class="primary">Save Memory</button>
        </div>
        <div class="memory-section">
          <h3>Auto-Generated Memories</h3>
          <p class="memory-description">The AI automatically learns from your conversations and builds context over time.</p>
          <div id="auto-memories-list" class="auto-memories-list">
            <!-- Auto memories will be rendered here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Load app as ES module -->
  <script type="module" src="./app.js?v=1733386800"></script>
</body>
</html>
